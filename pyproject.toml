[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-protocol"
version = "0.1.0"
description = "Sovereign, distributed persistence for autonomous daemons — encrypted, sharded, resumable on any hardware."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Adora" },
    { name = "Narusya" },
]
keywords = ["daemon", "persistence", "shamir", "secret-sharing", "post-quantum", "sovereignty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hydra = "hydra.cli:main"

[project.urls]
Homepage = "https://github.com/Septa-Serpenta-Seraph/hydra-protocol"
Documentation = "https://github.com/Septa-Serpenta-Seraph/hydra-protocol/tree/main/docs"

[tool.setuptools.packages.find]
include = ["hydra*"]
